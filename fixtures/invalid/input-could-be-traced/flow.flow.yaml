apiVersion: github.com/fwegener83/esdm-flow-extension/flow/v0
kind: flow
name: input-could-be-traced
description: Bob claims to type in the order number he has just seen in his order list.
scope: { domain: shop }
slices:
  - name: bob-places-order
    type: command
    trigger: { actor: customer, persona: bob }
    aggregate: { boundedContext: ordering, aggregate: order, instance: o-2, provenance: generated }
    when:
      command: place
      data: { customerId: c-bob, product: lamp, quantity: 1, unitPrice: 40 }
      provenance: { customerId: input, product: input, quantity: input, unitPrice: input }
    then:
      events:
        - event: placed
          data: { orderId: o-2, customerId: c-bob, product: lamp, quantity: 1, total: 40 }
          provenance:
            total:
              derived:
                from: [ { command: place, field: quantity }, { command: place, field: unitPrice } ]
                rule: quantity × unitPrice
  - name: bob-views-orders
    type: read-model
    trigger: { actor: customer, persona: bob }
    readModel: { boundedContext: ordering, readModel: my-orders }
    when:
      query: get-my-orders
      parameters: { customerId: c-bob }
      provenance: { customerId: input }
    then:
      result:
        - { orderId: o-2, total: 40, status: placed }
      provenance:
        0.status:
          derived:
            from: [ { slice: bob-places-order, event: placed } ]
            rule: A row is `placed` after `placed` and before `shipped` or `canceled`.
  - name: bob-cancels-order
    type: command
    trigger: { actor: customer, persona: bob }
    aggregate: { boundedContext: ordering, aggregate: order, instance: o-2 }
    when:
      command: cancel
      data: { orderId: o-2, reason: found it cheaper }
      provenance: { orderId: input, reason: input }
    then:
      events:
        - event: canceled
          data: { orderId: o-2, reason: found it cheaper, canceledAt: "2026-10-05T09:12:00Z" }
          provenance: { canceledAt: clock }
