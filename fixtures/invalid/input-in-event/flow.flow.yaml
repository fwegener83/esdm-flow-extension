apiVersion: github.com/fwegener83/esdm-flow-extension/flow/v0
kind: flow
name: input-in-event
description: Events record what happened; they cannot receive input the command did not carry.
scope: { domain: shop }
slices:
  - name: alice-places-order
    type: command
    trigger: { actor: customer, persona: alice }
    aggregate: { boundedContext: ordering, aggregate: order, instance: o-1, provenance: generated }
    when:
      command: place
      data: { customerId: c-alice, product: book, quantity: 2, unitPrice: 12.5 }
      provenance: { customerId: input, product: input, quantity: input, unitPrice: input }
    then:
      events:
        - event: placed
          data: { orderId: o-1, customerId: c-alice, product: notebook, quantity: 2, total: 25 }
          provenance:
            product: input
            total:
              derived:
                from: [ { command: place, field: quantity }, { command: place, field: unitPrice } ]
                rule: quantity × unitPrice
