apiVersion: github.com/fwegener83/esdm-flow-extension/flow/v0
kind: flow
name: wrong-instance-state
description: >
  The clerk ships Bob's order, but the shipped event carries Alice's
  customer ID. Both orders are of the same kind; only the instance state
  of o-2 counts.
scope: { domain: shop }
slices:
  - name: alice-places-order
    type: command
    trigger: { actor: customer, persona: alice }
    aggregate: { boundedContext: ordering, aggregate: order, instance: o-1, provenance: generated }
    when:
      command: place
      data: { customerId: c-alice, product: book, quantity: 2, unitPrice: 12.5 }
      provenance: { customerId: input, product: input, quantity: input, unitPrice: input }
    then:
      events:
        - event: placed
          data: { orderId: o-1, customerId: c-alice, product: book, quantity: 2, total: 25 }
          provenance:
            total:
              derived:
                from: [ { command: place, field: quantity }, { command: place, field: unitPrice } ]
                rule: quantity × unitPrice
  - name: bob-places-order
    type: command
    trigger: { actor: customer, persona: bob }
    aggregate: { boundedContext: ordering, aggregate: order, instance: o-2, provenance: generated }
    when:
      command: place
      data: { customerId: c-bob, product: lamp, quantity: 1, unitPrice: 40 }
      provenance: { customerId: input, product: input, quantity: input, unitPrice: input }
    then:
      events:
        - event: placed
          data: { orderId: o-2, customerId: c-bob, product: lamp, quantity: 1, total: 40 }
          provenance:
            total:
              derived:
                from: [ { command: place, field: quantity }, { command: place, field: unitPrice } ]
                rule: quantity × unitPrice
  - name: clerk-ships-order-2
    type: command
    trigger: { actor: warehouse-clerk }
    aggregate: { boundedContext: ordering, aggregate: order, instance: o-2 }
    when:
      command: ship
      data: { orderId: o-2 }
      provenance: { orderId: input }
    then:
      events:
        - event: shipped
          data: { orderId: o-2, customerId: c-alice, shippedAt: "2026-10-05T14:30:00Z" }
          provenance: { shippedAt: clock }
